name: Eta Build

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'coexist/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: 构建正式版 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK 工具
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: 安装 Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: 生成发布签名（无正式证书时使用临时 key）
        run: |
          if [[ -n "${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}" ]]; then
            printf '%s' "${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/eta-release.jks"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/eta-release.jks" \
              -storepass android -keypass android \
              -alias etarelease -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Eta Standard,OU=Dev,O=Eta,L=Beijing,S=Beijing,C=CN"
          fi
          echo "ETA_RELEASE_STORE_FILE=$RUNNER_TEMP/eta-release.jks" >> "$GITHUB_ENV"
          echo "ETA_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ETA_RELEASE_KEY_ALIAS=etarelease" >> "$GITHUB_ENV"
          echo "ETA_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: 构建正式版 Release APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleStandardRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          release_apk="app/build/outputs/apk/standard/release/app-standard-release.apk"
          if [[ ! -f "$release_apk" ]]; then
            release_apk="$(find app/build/outputs/apk/standard/release -name '*.apk' | head -n 1)"
          fi
          output_dir="$RUNNER_TEMP/apks"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)"

          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到正式版 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "$release_apk"
          mkdir -p "$output_dir"
          cp "$release_apk" "$output_dir/eta-standard-release.apk"
          echo "release_path=$output_dir/eta-standard-release.apk" >> "$GITHUB_OUTPUT"

      - name: 上传共存版 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ steps.apk.outputs.release_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
